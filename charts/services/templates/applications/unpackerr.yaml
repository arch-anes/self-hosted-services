{{- if (include "app.enabled" (list . "unpackerr")) }}
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: unpackerr
#   namespace: "{{ .Values.applicationsNamespace }}"
# type: Opaque
# stringData:
#   ui_password: "admin:somepass"

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: unpackerr
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: oci://oci.trueforge.org/truecharts/unpackerr
  version: 19.1.2
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  serverSide: "true"
  forceConflicts: true
  values:
    podOptions:
      defaultAffinity: false
    workload:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        podSpec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/instance
                        operator: In
                        values:
                          - transmission
                  topologyKey: "kubernetes.io/hostname"
          containers:
            main:
              env:
                {{- if (include "app.enabled" (list . "sonarr")) }}
                UN_SONARR_0_URL: http://sonarr:8989
                UN_SONARR_0_API_KEY:
                  secretKeyRef:
                    name: arr
                    key: sonarr_api_key
                    expandObjectName: false
                {{- end }}
                {{- if (include "app.enabled" (list . "radarr")) }}
                UN_RADARR_0_URL: http://radarr:7878
                UN_RADARR_0_API_KEY:
                  secretKeyRef:
                    name: arr
                    key: radarr_api_key
                    expandObjectName: false
                {{- end }}
                {{- if .Values.applications.unpackerr.dashboard.enabled }}
                UN_WEBSERVER_UI_PASSWORD:
                  secretKeyRef:
                    name: unpackerr
                    key: ui_password
                    expandObjectName: false
                {{- end }}
                {{- if (include "metrics.enabled" .) }}
                UN_WEBSERVER_METRICS: "true"
                UN_WEBSERVER_API_KEYS_0_NAME: prometheus
                UN_WEBSERVER_API_KEYS_0_KEY:
                  secretKeyRef:
                    name: unpackerr-metrics
                    key: api_key
                    expandObjectName: false
                UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
                UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read
                {{- end }}
    service:
      main:
        enabled: {{ or .Values.applications.unpackerr.dashboard.enabled (eq (include "metrics.enabled" .) "true") }}
        ports:
          main:
            enabled: true
            port: 5656
    global:
      traefik:
        commonMiddlewares: []
    ingress:
      main:
        enabled: {{ .Values.applications.unpackerr.dashboard.enabled }}
        annotations:
          {{- if .Values.applications.unpackerr.private }}
          traefik.ingress.kubernetes.io/router.middlewares: platform-intranet-allowlist@kubernetescrd
          {{- end }}
          homer.service.name: Arr
          homer.item.name: Unpackerr
          homer.item.logo: "https://unpackerr.zip/img/icon.png"
        hosts:
          - host: unpackerr.{{ .Values.fqdn }}
            paths:
              - path: /
        tls:
          - secretName: "{{ .Values.fqdn }}-tls"
            hosts:
              - unpackerr.{{ .Values.fqdn }}
    {{- if (include "metrics.enabled" .) }}
    extraTpl:
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: unpackerr-metrics
          namespace: "{{ .Values.applicationsNamespace }}"
        spec:
          refreshPolicy: CreatedOnce
          target:
            name: unpackerr-metrics
            creationPolicy: Owner
            deletionPolicy: Retain
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: huge-alphanumerical-password-generator
              rewrite:
                - transform:
                    template: api_key
      - apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: unpackerr
          namespace: "{{ .Values.applicationsNamespace }}"
        spec:
          jobLabel: app.kubernetes.io/name
          selector:
            matchLabels:
              service.name: main
              app.kubernetes.io/name: unpackerr
              app.kubernetes.io/instance: unpackerr
          endpoints:
            - port: main
              path: /metrics
              authorization:
                type: Bearer
                credentials:
                  name: unpackerr-metrics
                  key: api_key
              relabelings:
                - action: replace
                  # Stable “instance” = app.kubernetes.io/instance
                  sourceLabels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_instance]
                  separator: ":"
                  replacement: "$1$2"
                  targetLabel: instance
                - action: labeldrop
                  regex: pod
              metricRelabelings:
                - action: labeldrop
                  regex: pod
    {{- end }}
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "100Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "100m") }}
      limits:
        memory: 1Gi
        cpu: 0
    persistence:
      config:
        enabled: false
      downloads:
        type: pvc
        mountPath: /jellyfin/Downloads
        subPath: Downloads
        existingClaim: multimedia
{{- end }}
