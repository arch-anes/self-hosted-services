{{- if (include "app.enabled" (list . "chaptarr")) }}
{{- include "app.require" (list . "Chaptarr" "postgresql" "PostgreSQL") -}}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: chaptarr
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: chaptarr
  repo: https://arch-anes.github.io/charts
  version: 0.1.0
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  serverSide: "true"
  forceConflicts: true
  values:
    workload:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        podSpec:
          nodeSelector:
            nas: "true"
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/instance
                        operator: In
                        values:
                          - jellyfin
                  topologyKey: "kubernetes.io/hostname"
          containers:
            main:
              env:
                CHAPTARR__APP__THEME: dark
                CHAPTARR__AUTH__METHOD: Forms
                CHAPTARR__AUTH__REQUIRED: Enabled
                CHAPTARR__POSTGRES__HOST: postgresql-primary
                CHAPTARR__POSTGRES__PORT: "5432"
                CHAPTARR__POSTGRES__MAINDB: chaptarr-main
                CHAPTARR__POSTGRES__LOGDB: chaptarr-log
                CHAPTARR__POSTGRES__CACHEDB: chaptarr-cache
                CHAPTARR__POSTGRES__USER: chaptarr
                CHAPTARR__POSTGRES__PASSWORD:
                  secretKeyRef:
                    name: postgresql-pguser-chaptarr
                    key: password
                    expandObjectName: false
                CHAPTARR__AUTH__APIKEY:
                  secretKeyRef:
                    name: arr
                    key: chaptarr_api_key
                    expandObjectName: false
                PGSSLMODE: verify-full
                PGSSLROOTCERT: /etc/postgres/tls/ca.crt
                PGSSLCERT: /etc/postgres/tls/tls.crt
                PGSSLKEY: /etc/postgres/tls/tls.key
            exportarr:
              env:
                API_KEY:
                  secretKeyRef:
                    name: arr
                    key: chaptarr_api_key
                    expandObjectName: false
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "500Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "250m") }}
      limits:
        memory: 2Gi
        cpu: null
    global:
      traefik:
        commonMiddlewares: []
    ingress:
      main:
        enabled: true
        annotations:
          homer.service.name: Arr
          homer.item.name: Chaptarr
          homer.item.logo: "https://raw.githubusercontent.com/Chaptarr/chaptarr/develop/Logo/chaptarr.png"
        hosts:
          - host: chaptarr.{{ .Values.fqdn }}
            paths:
              - path: /
        tls:
          - secretName: "{{ .Values.fqdn }}-tls"
            hosts:
              - chaptarr.{{ .Values.fqdn }}
    persistence:
      postgresql-certs:
        enabled: true
        type: secret
        objectName: postgresql-cluster-cert
        expandObjectName: false
        mountPath: /etc/postgres/tls
        readOnly: true
        defaultMode: "0400"
      config:
        type: emptyDir
      multimedia:
        enabled: true
        type: pvc
        mountPath: /jellyfin
        existingClaim: multimedia
    metrics:
      main:
        enabled: {{ include "metrics.enabled" . | default false }}
        endpoints:
          - port: metrics
            path: /metrics
            relabelings:
              - action: replace
                # Stable “instance” = app.kubernetes.io/instance (bazarr|chaptarr|prowlarr|radarr|sonarr|)
                sourceLabels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_instance]
                separator: ":"
                replacement: "$1$2"
                targetLabel: instance
{{- end }}
