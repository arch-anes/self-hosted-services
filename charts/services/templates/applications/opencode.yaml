{{- if (include "app.enabled" (list . "opencode")) }}
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: opencode
#   namespace: "{{ .Values.applicationsNamespace }}"
# type: Opaque
# stringData:
#   server_username: "admin"
#   server_password: "password"

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: opencode
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: opencode
  repo: https://arch-anes.github.io/charts
  version: 2.2.7
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  serverSide: "true"
  forceConflicts: true
  values:
    podOptions:
      defaultAffinity: false
    workload:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        podSpec:
          labels:
            networking.arch-anes.io/egress.ai: "true"
          containers:
            main:
              env:
                OPENCODE_SERVER_USERNAME:
                  secretKeyRef:
                    name: opencode
                    key: server_username
                    expandObjectName: false
                OPENCODE_SERVER_PASSWORD:
                  secretKeyRef:
                    name: opencode
                    key: server_password
                    expandObjectName: false
              extraArgs:
                - --cors
                - https://code.{{ .Values.fqdn }}
              resources:
                requests:
                  cpu: {{ include "app.resources.cpu" (list $ "100m") }}
                  memory: {{ include "app.resources.memory" (list $ "512Mi") }}
                limits:
                  cpu: null
                  memory: 16Gi
    ingress:
      main:
        enabled: true
        annotations:
          homer.service.name: Automation
          homer.item.name: OpenCode
          homer.item.logo: "https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/console/app/src/asset/logo-ornate-dark.svg"
          traefik.ingress.kubernetes.io/router.middlewares: platform-intranet-allowlist@kubernetescrd
        hosts:
          - host: code.{{ .Values.fqdn }}
            paths:
              - path: /
        tls:
          - secretName: "{{ .Values.fqdn }}-tls"
            hosts:
              - code.{{ .Values.fqdn }}
    persistence:
      home:
        type: pvc
        storageClass: local-path-persistent-namespaced
{{- end }}
