# Shared middlewares used by the public Traefik release. They live in the
# application namespace so the public release does not need to watch, or read
# secrets from, the platform namespace.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-websecure
  namespace: "{{ .Values.applicationsNamespace }}"
  labels:
    networking.arch-anes.io/public: "true"
spec:
  headers:
    browserXssFilter: true
    stsPreload: true
    stsIncludeSubdomains: true
    forceSTSHeader: true
    stsSeconds: 15552000

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-redirect-www
  namespace: "{{ .Values.applicationsNamespace }}"
  labels:
    networking.arch-anes.io/public: "true"
spec:
  redirectRegex:
    regex: ^https?://www\.(.*)
    replacement: https://$1
    permanent: true

{{- if (include "app.enabled" (list . "crowdsec")) }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: "{{ .Values.applicationsNamespace }}"
  labels:
    networking.arch-anes.io/public: "true"
spec:
  plugin:
    crowdsec-bouncer-traefik-plugin:
      enabled: true
      crowdsecAppsecFailureBlock: false
      crowdsecAppsecUnreachableBlock: false
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service:8080
      crowdsecLapiKeyFile: /etc/traefik/secrets/crowdsec/bouncer_key
      updateMaxFailure: 10
      redisCacheEnabled: false
      forwardedHeadersTrustedIPs:
        {{- concat (include "ip.public_proxy_ranges" . | fromYamlArray) (include "ip.private_proxy_ranges" . | fromYamlArray) | toYaml | nindent 8 }}
      clientTrustedIPs:
        {{- include "ip.private_ranges" . | nindent 8 }}
{{- end }}
