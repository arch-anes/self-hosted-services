{{- if (include "app.enabled" (list . "octoprint")) }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: octoprint
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: oci://oci.trueforge.org/truecharts/octoprint
  version: 17.6.0
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  serverSide: "true"
  forceConflicts: true
  values:
    podOptions:
      nodeSelector:
        # TrueCharts auto-injects an amd64 nodeSelector by default.
        # Nullifying it here allows the pod to schedule on other architectures (e.g. arm64).
        kubernetes.io/arch: null
      # TrueCharts auto-injects a podAffinity for PVCs that requires a pod with the 
      # truecharts.org/pvc label to already exist on the node. Since data is unique 
      # to octoprint, this deadlocks the first pod in Pending state. Disable to allow scheduling.
      defaultAffinity: false
    workload:
      main:
        strategy: Recreate
        podSpec:
          annotations:
            backup.velero.io/backup-volumes: data
          containers:
            main:
              env:
                ENABLE_MJPG_STREAMER: "true"
                MJPG_STREAMER_INPUT: "-fps 30 -r 1920x1080"
                CAMERA_DEV: /dev/video0
              resources:
                requests:
                  memory: {{ include "app.resources.memory" (list $ "512Mi") }}
                  cpu: {{ include "app.resources.cpu" (list $ "2000m") }}
                limits:
                  memory: 2Gi
                  cpu: null
                  {{- range .Values.applications.octoprint.devices }}
                  {{ . }}: "1"
                  {{- end }}
    service:
      webcam:
        enabled: true
        ports:
          webcam:
            enabled: true
            port: 8080
            targetPort: 8080
    ingress:
      main:
        enabled: true
        annotations:
          homer.service.name: Automation
          homer.item.name: OctoPrint
          homer.item.logo: "https://raw.githubusercontent.com/OctoPrint/OctoPrint/a93b4d397248dc406a75e634c1326fb1b8ddcb63/docs/images/octoprint-logo.png"
        hosts:
          - host: octoprint.{{ .Values.fqdn }}
            paths:
              - path: /
        tls:
          - secretName: "{{ .Values.fqdn }}-tls"
            hosts:
              - octoprint.{{ .Values.fqdn }}
      webcam:
        enabled: true
        annotations:
          prometheus.io/probe: "false"
          homer.item.excluded: "true"
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-cluster-admin-authentication@kubernetescrd
        hosts:
          - host: octoprint-webcam.{{ .Values.fqdn }}
            paths:
              - path: /
                service:
                  name: webcam
                  port: 8080
        tls:
          - secretName: "{{ .Values.fqdn }}-tls"
            hosts:
              - octoprint-webcam.{{ .Values.fqdn }}
    persistence:
      data:
        enabled: true
        type: pvc
        storageClass: local-path-persistent-namespaced
        size: 10Gi
{{- end }}
