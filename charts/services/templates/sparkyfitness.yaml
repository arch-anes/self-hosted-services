{{- if (include "app.enabled" (list . "sparkyfitness")) }}
{{- include "app.require" (list . "SparkyFitness" "postgresql" "PostgreSQL") -}}

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sparkyfitness
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: oci://ghcr.io/codewithcj/charts/sparkyfitness
  version: 1.6.1
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  values:
    config:
      frontendUrl: "https://fit.{{ .Values.fqdn }}"
      adminEmail: "admin@{{ .Values.fqdn }}"
      extraTrustedOrigins: "https://fit.{{ .Values.fqdn }}"
      forceEmailLogin: {{ not (include "app.enabled" (list . "authentik")) }}
      disableEmailLogin: {{ include "app.enabled" (list . "authentik") }}
      disableSignup: false
{{- if (include "app.enabled" (list . "authentik")) }}
      oidc:
        enabled: true
        providerSlug: "authentik"
        providerName: "Authentik"
        issuerUrl: "https://auth.{{ .Values.fqdn }}/application/o/sparkyfitness/"
        scope: "openid email profile"
        autoRegister: true
        autoRedirect: true
        adminGroup: "authentik Admins"
        secrets:
          existingSecret: "sparkyfitness-oidc"
{{- end }}
      email:
        enabled: true
        port: 587
        secure: true
        from: "no-reply@{{ .Values.fqdn }}"
        secrets:
          existingSecret: "smtp"
          existingSecretKeys:
            username: username
            password: password
    postgresql:
      enabled: false
    externalDatabase:
      host: postgresql-primary
      port: 5432
      database: sparkyfitness
      auth:
        existingSecret: postgresql-pguser-sparkyfitness
        existingSecretKeys:
          username: user
          password: password
    server:
      appDatabase:
        existingSecret: postgresql-pguser-sparkyfitness
        existingSecretKeys:
          username: user
          password: password
      secrets:
        generate: true
      extraEnv:
        - name: PGSSLMODE
          value: "verify-full"
        - name: PGSSLROOTCERT
          value: "/etc/ssl/postgresql/ca.crt"
        - name: NODE_EXTRA_CA_CERTS
          value: "/etc/ssl/postgresql/ca.crt"
        - name: SPARKY_FITNESS_EMAIL_HOST
          valueFrom:
            secretKeyRef:
              name: smtp
              key: hostname
      extraVolumes:
        - name: postgresql-ca
          secret:
            secretName: postgresql-cluster-cert
            items:
              - key: ca.crt
                path: ca.crt
      extraVolumeMounts:
        - name: postgresql-ca
          mountPath: /etc/ssl/postgresql
          readOnly: true
      resources:
        requests:
          memory: {{ include "app.resources.memory" (list $ "256Mi") }}
          cpu: {{ include "app.resources.cpu" (list $ "250m") }}
        limits:
          memory: 512Mi
          cpu: null
      podAnnotations:
        reloader.stakater.com/auto: "true"
        backup.velero.io/backup-volumes: "uploads"
    frontend:
      resources:
        requests:
          memory: {{ include "app.resources.memory" (list $ "128Mi") }}
          cpu: {{ include "app.resources.cpu" (list $ "100m") }}
        limits:
          memory: 256Mi
          cpu: null
      podAnnotations:
        reloader.stakater.com/auto: "true"
    ingress:
      enabled: true
      annotations:
        homer.service.name: "Monitoring"
        homer.item.name: "SparkyFitness"
        homer.item.logo: "https://codewithcj.github.io/SparkyFitness/logo.png"
      hosts:
        - host: fit.{{ .Values.fqdn }}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: "{{ .Values.fqdn }}-tls"
          hosts:
            - fit.{{ .Values.fqdn }}
{{- if (include "app.enabled" (list . "authentik")) }}
    extraObjects:
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: sparkyfitness-oidc
          namespace: "{{ .Values.applicationsNamespace }}"
        spec:
          refreshPolicy: CreatedOnce
          target:
            creationPolicy: Owner
            deletionPolicy: Retain
            name: sparkyfitness-oidc
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: alphanumerical-password-generator
              rewrite:
                - transform:
                    template: client_id
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: huge-alphanumerical-password-generator
              rewrite:
                - transform:
                    template: client_secret
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: sparkyfitness-authentik-blueprint
          namespace: "{{ .Values.applicationsNamespace }}"
        data:
          blueprint.yaml: |
            # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
            version: 1
            metadata:
              name: SparkyFitness OAuth2 Provider
            entries:
              - id: sparkyfitness-provider
                model: authentik_providers_oauth2.oauth2provider
                identifiers:
                  name: Provider for SparkyFitness
                attrs:
                  grant_types:
                    - authorization_code
                    - refresh_token
                  authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                  invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
                  client_type: confidential
                  redirect_uris:
                    - matching_mode: strict
                      url: "https://fit.{{ .Values.fqdn }}/api/auth/sso/callback/authentik"
                  signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                  client_id: !File /blueprints/mounted/secret-sparkyfitness-oidc/client_id
                  client_secret: !File /blueprints/mounted/secret-sparkyfitness-oidc/client_secret
                  property_mappings:
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
              - id: sparkyfitness-app
                model: authentik_core.application
                identifiers:
                  slug: sparkyfitness
                attrs:
                  name: SparkyFitness
                  provider: !KeyOf sparkyfitness-provider
                  policy_engine_mode: any
{{- end }}
{{- end }}
