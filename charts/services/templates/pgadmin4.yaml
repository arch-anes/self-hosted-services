{{- if (include "app.enabled" (list . "pgadmin4")) }}
{{- include "app.require" (list . "pgAdmin4" "postgresql" "PostgreSQL") -}}
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: pgadmin4
#   namespace: "{{ .Values.applicationsNamespace }}"
# type: Opaque
# stringData:
#   password: "somepassword"

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: pgadmin4
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: pgadmin4
  repo: https://helm.runix.net
  version: 1.66.0
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  serverSide: "true"
  forceConflicts: true
  values:
    annotations:
      reloader.stakater.com/auto: "true"
    existingSecret: pgadmin4
    secretKeys:
      pgadminPasswordKey: "password"
    env:
      email: admin@{{ .Values.fqdn }}
    envVarsExtra:
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgresql-pguser-pgadmin4
            key: password
      - name: PGADMIN_CONFIG_CONFIG_DATABASE_URI
        value: '"postgresql://pgadmin4:$(DATABASE_PASSWORD)@postgresql-primary:5432/pgadmin4"'
    extraVolumes:
      - name: postgresql-certs
        secret:
          secretName: postgresql-cluster-cert
          defaultMode: 0400
    extraVolumeMounts:
      - name: postgresql-certs
        mountPath: /etc/postgres/tls
    persistentVolume:
      enabled: false
    ingress:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/app: "pgadmin4"
        gethomepage.dev/group: Administration
        gethomepage.dev/name: pgAdmin4
        gethomepage.dev/icon: "https://www.pgadmin.org/static/docs/pgadmin4-dev/docs/en_US/_build/html/_images/logo-right-128.png"
        traefik.ingress.kubernetes.io/router.middlewares: kube-system-intranet-allowlist@kubernetescrd
      hosts:
        - host: pgadmin4.{{ .Values.fqdn }}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: "{{ .Values.fqdn }}-tls"
          hosts:
            - pgadmin4.{{ .Values.fqdn }}
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "256Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "125m") }}
      limits:
        memory: 1Gi
{{- end }}
