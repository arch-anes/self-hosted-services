{{- if (include "app.enabled" (list . "stalwart")) }}
{{- include "app.require" (list . "Stalwart" "postgresql" "PostgreSQL") -}}
{{- include "app.require" (list . "Stalwart" "authentik" "Authentik") -}}
{{- include "app.require" (list . "Stalwart" "minio" "MinIO") -}}

# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: stalwart
#   namespace: "{{ .Values.applicationsNamespace }}"
# type: Opaque
# stringData:
#   bucket-access-key: "some_key"
#   bucket-secret-key: "some_key"
#   recovery-admin: "admin:some_password"
#   default-admin-password: "some_password"

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: stalwart
  namespace: "{{ .Values.applicationsNamespace }}"
spec:
  chart: stalwart
  repo: https://arch-anes.github.io/charts
  version: 0.2.0
  targetNamespace: "{{ .Values.applicationsNamespace }}"
  serverSide: "true"
  forceConflicts: true
  values:
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                POSTGRESQL_PASSWORD:
                  secretKeyRef:
                    name: postgresql-pguser-stalwart
                    key: password
                    expandObjectName: false
                STALWART_RECOVERY_ADMIN:
                  secretKeyRef:
                    name: stalwart
                    key: recovery-admin
                    expandObjectName: false
                LDAP_BIND_PASSWORD:
                  secretKeyRef:
                    name: ldap
                    key: bind_password
                    expandObjectName: false
                BUCKET_ACCESS_KEY:
                  secretKeyRef:
                    name: stalwart
                    key: bucket-access-key
                    expandObjectName: false
                BUCKET_SECRET_KEY:
                  secretKeyRef:
                    name: stalwart
                    key: bucket-secret-key
                    expandObjectName: false
                SMTP_PASSWORD:
                  secretKeyRef:
                    name: smtp
                    key: password
                    expandObjectName: false
      apply-config:
        podSpec:
          initContainers:
            wait-for-stalwart:
              env:
                # These environment variables are substituted before getting applied
                SMTP_HOST:
                  secretKeyRef:
                    name: smtp
                    key: hostname
                    expandObjectName: false
                SMTP_NAME:
                  secretKeyRef:
                    name: smtp
                    key: username
                    expandObjectName: false
          containers:
            apply-config:
              env:
                STALWART_PASSWORD:
                  secretKeyRef:
                    name: stalwart
                    key: default-admin-password
                    expandObjectName: false
    configmap:
      authentik-blueprint:
        enabled: true
        data:
          blueprint.yaml: |
            # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
            version: 1
            metadata:
              name: Stalwart provisionning
            entries:
              - id: postmaster-mail
                model: authentik_core.group
                identifiers:
                  name: postmaster
                attrs:
                  attributes:
                    mailAlias:
                      - "postmaster@{{ .Values.fqdn }}"

              - id: info-mail
                model: authentik_core.group
                identifiers:
                  name: info
                attrs:
                  attributes:
                    mailAlias:
                      - "info@{{ .Values.fqdn }}"
    ingress:
      main:
        enabled: true
        annotations:
          prometheus.io/probe: "false"
          homer.service.name: Administration
          homer.item.name: Stalwart
          homer.item.logo: https://raw.githubusercontent.com/stalwartlabs/stalwart/de7f0e8e37edce397a196bf47f08f1eaa2743078/img/logo-red.svg
        hosts:
          - host: mail.{{ .Values.fqdn }}
            paths:
              - path: /
                pathType: Prefix
          - host: {{ .Values.fqdn }}
            paths:
              - path: /.well-known/
                pathType: Prefix
        tls:
          - secretName: {{ .Values.fqdn }}-tls
            hosts:
              - mail.{{ .Values.fqdn }}
              - {{ .Values.fqdn }}
    stalwart:
      baseConfig: &postgresql
        "@type": PostgreSql
        host: postgresql-primary
        database: stalwart
        authUsername: stalwart
        authSecret:
          "@type": "EnvironmentVariable"
          variableName: POSTGRESQL_PASSWORD
      runtimeConfig:
        - "@type": upsert
          object: Tracer
          matchOn:
            - "@type"
          value:
              stdout:
                "@type": Stdout
                level: info
              otel:
                "@type": OtelHttp
                level: trace
                enable: {{ (include "app.enabled" (list . "tempo")) }}
                endpoint: http://tempo.kube-system.svc.cluster.local:4318/v1/traces
                httpAuth:
                  "@type": Unauthenticated
                enableLogExporter: false
                enableSpanExporter: true
        - "@type": update
          object: Metrics
          value:
              openTelemetry:
                "@type": Disabled
              prometheus:
                {{- if include "metrics.enabled" . }}
                "@type": Enabled
                authSecret:
                  "@type": None
                {{- else }}
                "@type": Disabled
                {{- end }}
        - "@type": update
          object: DataStore
          value: *postgresql
        - "@type": update
          object: SearchStore
          value: *postgresql
        - "@type": update
          object: BlobStore
          value:
              "@type": S3
              bucket: "stalwart"
              region:
                "@type": Custom
                customEndpoint: http://minio
                customRegion: us-east-1
              accessKey:
                "@type": "EnvironmentVariable"
                variableName: BUCKET_ACCESS_KEY
              secretKey:
                "@type": "EnvironmentVariable"
                variableName: BUCKET_SECRET_KEY
              securityToken:
                "@type": None
              sessionToken:
                "@type": None
        - "@type": upsert
          object: Directory
          matchOn:
            - "@type"
          value:
              # TODO: verify
              authentik:
                # https://github.com/stalwartlabs/stalwart/discussions/521
                "@type": Ldap
                description: "Authentik LDAP"
                url: ldap://ak-outpost-ldap-outpost:389
                baseDn: {{ include "ldap.base_dn" . }}
                bindDn: "cn=ldapservice,{{ include "ldap.base_dn" . }}"
                bindSecret:
                  "@type": "EnvironmentVariable"
                  variableName: LDAP_BIND_PASSWORD
                # https://github.com/goauthentik/authentik/issues/17956
                filterLogin: "(|(mail=?)(mailAlias=?)(recoveryEmail=?))"
                filterMailbox: "(|(mail=?)(mailAlias=?)(recoveryEmail=?))"
                # https://github.com/stalwartlabs/stalwart/discussions/521#discussioncomment-12108062
                filterMemberOf: "(&(objectClass=posixGroup)(cn=?))"
                attrClass:
                  objectClass: true
                attrDescription:
                  sAMAccountName: true
                attrEmail:
                  mail: true
                attrEmailAlias:
                  mailAlias: true
                attrMemberOf:
                  memberOf: true
                attrSecretChanged:
                  pwdChangedTime: true
        - "@type": update
          object: Authentication
          value:
              directoryId: "#authentik"
        - "@type": upsert
          object: Domain
          matchOn:
            - name
          value:
              default:
                name: "{{ .Values.fqdn }}"
                dkimManagement:
                  "@type": Manual
        - "@type": update
          object: SystemSettings
          value:
              defaultDomainId: "#default"
              defaultHostname: "mail.{{ .Values.fqdn }}"
        - "@type": upsert
          object: NetworkListener
          matchOn:
            - name
          value:
              smtp:
                name: smtp
                bind:
                  "[::]:25": true
                protocol: smtp
                useTls: false
                overrideProxyTrustedNetworks:
                  {{- range $network := (include "ip.proxy_ranges" . | fromYamlArray) }}
                  {{ $network }}: true
                  {{- end }}
              smtps:
                name: submissions
                bind:
                  "[::]:465": true
                protocol: smtp
                tlsImplicit: true
                overrideProxyTrustedNetworks:
                  {{- range $network := (include "ip.proxy_ranges" . | fromYamlArray) }}
                  {{ $network }}: true
                  {{- end }}
              imaps:
                name: imaps
                bind:
                  "[::]:993": true
                protocol: imap
                tlsImplicit: true
                overrideProxyTrustedNetworks:
                  {{- range $network := (include "ip.proxy_ranges" . | fromYamlArray) }}
                  {{ $network }}: true
                  {{- end }}
              pop3s:
                name: pop3s
                bind:
                  "[::]:995": true
                protocol: pop3
                tlsImplicit: true
                overrideProxyTrustedNetworks:
                  {{- range $network := (include "ip.proxy_ranges" . | fromYamlArray) }}
                  {{ $network }}: true
                  {{- end }}
        - "@type": update
          object: Http
          value:
              useXForwarded: true
        - "@type": upsert
          object: Certificate
          matchOn:
            - certificate
          value:
              default:
                certificate:
                  "@type": "File"
                  filePath: "/opt/stalwart/etc/certs/tls.crt"
                privateKey:
                  "@type": "File"
                  filePath: "/opt/stalwart/etc/certs/tls.key"
        - "@type": update
          object: Email
          value:
              compressionAlgorithm: lz4
        - "@type": update
          object: MtaStageAuth
          value:
              saslMechanisms:
                else: "[plain, login]"
              require:
                else: "listener != 'smtp'"
        - "@type": upsert
          object: MtaRoute
          matchOn:
            - name
          value:
              relay:
                "@type": Relay
                name: relay
                address: "${SMTP_HOST}"
                port: 587
                implicitTls: false
                protocol: smtp
                authUsername: "${SMTP_NAME}"
                authSecret:
                  "@type": "EnvironmentVariable"
                  variableName: SMTP_PASSWORD
        - "@type": upsert
          object: MtaVirtualQueue
          matchOn:
            - name
          value:
              remote:
                name: remote
        - "@type": upsert
          object: MtaDeliverySchedule
          matchOn:
            - name
          value:
              relay:
                name: relay
                queueId: "#remote"
                expiry:
                  "@type": Ttl
                notify:
                  "@type": Default
                retry:
                  "@type": Custom
                  intervals:
                    "0":
                      duration: 120000 #"2m"
                    "1":
                      duration: 300000 #"5m"
                    "2":
                      duration: 600000 #"10m"
                    "3":
                      duration: 900000 #"15m"
                    "4":
                      duration: 1800000 #"30m"
                    "5":
                      duration: 3600000 #"1h"
                    "6":
                      duration: 7200000 #"2h"
        - "@type": update
          object: MtaOutboundStrategy
          value:
              route:
                else: "'relay'"
              schedule:
                else: "'relay'"
        - "@type": update
          object: SpamClassifier
          value:
              model:
                "@type": FtrlFh
        - "@type": upsert
          object: SpamRule
          matchOn:
            - name
          value:
              aws_ses_flagged:
                "@type": Header
                name: AWS_SES_FLAGGED
                description: "Trust AWS SES Spam and Virus verdicts"
                condition:
                  match:
                    "0":
                      if: "(name_lower == 'x-ses-spam-verdict' || name_lower == 'x-ses-virus-verdict') && contains(value_lower, 'fail')"
                      then: "'AWS_SES_FLAGGED'"
                  else: "''"
        - "@type": upsert
          object: SpamTag
          matchOn:
            - tag
          value:
              ses_flagged:
                "@type": Score
                tag: AWS_SES_FLAGGED
                score: 1000
        - "@type": create
          object: Action
          value:
              reload_settings:
                "@type": "ReloadSettings"
              reload_certificates:
                "@type": "ReloadTlsCertificates"
    ingressRouteTCP:
      smtp:
        match: HostSNI(`mail.{{ .Values.fqdn }}`)
        entryPoint: mx
      smtps:
        match: HostSNI(`mail.{{ .Values.fqdn }}`)
        entryPoint: smtp
      imaps:
        match: HostSNI(`mail.{{ .Values.fqdn }}`)
        entryPoint: imap
      imap:
        enabled: false
      pop3:
        enabled: false
      pop3s:
        enabled: false
      submission:
        enabled: false
      sieve:
        enabled: false
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: {{ include "app.resources.cpu" (list $ "100m") }}
        memory: {{ include "app.resources.memory" (list $ "256Mi") }}
    metrics:
      main:
        enabled: {{ include "metrics.enabled" . | default false }}
    persistence:
      data:
        storageClass: local-path-persistent-namespaced
      certificates:
        enabled: true
        type: secret
        objectName: "{{ .Values.fqdn }}-tls"
        expandObjectName: false
        mountPath: /opt/stalwart/etc/certs
        readOnly: true
{{- end }}
