{{- if and .Values.primaryTenant (include "app.enabled" (list . "nvidia_gpu")) }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nvidia-gpu
  namespace: kube-system
spec:
  chart: nvidia-device-plugin
  repo: https://nvidia.github.io/k8s-device-plugin
  version: 0.20.0
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true
  values:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: "dedicated"
        operator: Equal
        value: "ai"
        effect: "NoSchedule"
    nfd:
      enabled: false
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "64Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "250m") }}
      limits:
        memory: 128Mi
{{- end }}
