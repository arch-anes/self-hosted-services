{{- if .Values.primaryTenant }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: linkerd-crds
  namespace: kube-system
spec:
  chart: linkerd-crds
  repo: https://helm.linkerd.io/edge
  version: 2026.6.3
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: linkerd-control-plane
  namespace: kube-system
spec:
  chart: linkerd-control-plane
  repo: https://helm.linkerd.io/edge
  version: 2026.6.3
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true
  values:
    controllerReplicas: {{ include "ha.replicas" . }}
    enablePodAntiAffinity: {{ include "ha.enabled" . | default false }}
    enablePodDisruptionBudget: {{ include "ha.enabled" . | default false }}
    webhookFailurePolicy: Fail
    controllerResources: &linkerd_controller_resources
      cpu:
        request: {{ include "app.resources.cpu" (list $ "100m") }}
      memory:
        request: {{ include "app.resources.memory" (list $ "50Mi") }}
        limit: 250Mi
    destinationResources: *linkerd_controller_resources
    heartbeatResources: *linkerd_controller_resources
    proxyInjectorResources: *linkerd_controller_resources
    spValidatorResources: *linkerd_controller_resources
    proxyInjector:
      namespaceSelector:
        matchExpressions:
          - key: config.linkerd.io/admission-webhooks
            operator: NotIn
            values:
              - disabled
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - cert-manager
    identityResources:
      cpu:
        request: {{ include "app.resources.cpu" (list $ "100m") }}
      memory:
        request: {{ include "app.resources.memory" (list $ "10Mi") }}
        limit: 32Mi
    proxy:
      resources:
        cpu:
          request: {{ include "app.resources.cpu" (list $ "100m") }}
        memory:
          request: {{ include "app.resources.memory" (list $ "20Mi") }}
          limit: 250Mi
    identity:
      externalCA: true
      issuer:
        scheme: kubernetes.io/tls
    podMonitor:
      enabled: {{ include "metrics.enabled" . | default false }}

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: linkerd-certificates
  namespace: kube-system
spec:
  chart: generic
  repo: https://arch-anes.github.io/charts
  version: 0.2.1
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true
  values:
    objects:
      - apiVersion: cert-manager.io/v1
        kind: Issuer
        metadata:
          name: linkerd-trust-root-issuer
          namespace: kube-system
        spec:
          selfSigned: {}
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: linkerd-trust-anchor
          namespace: kube-system
        spec:
          issuerRef:
            kind: Issuer
            name: linkerd-trust-root-issuer
          secretName: linkerd-trust-anchor
          isCA: true
          commonName: root.linkerd.cluster.local
          duration: 8760h0m0s
          renewBefore: 7320h0m0s
          privateKey:
            rotationPolicy: Always
            algorithm: ECDSA
      - apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: linkerd-identity-issuer
        spec:
          ca:
            secretName: linkerd-trust-anchor
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: linkerd-identity-issuer
          namespace: kube-system
        spec:
          issuerRef:
            kind: ClusterIssuer
            name: linkerd-identity-issuer
          secretName: linkerd-identity-issuer
          isCA: true
          commonName: identity.linkerd.cluster.local
          duration: 48h0m0s
          renewBefore: 25h0m0s
          privateKey:
            rotationPolicy: Always
            algorithm: ECDSA
      - apiVersion: trust.cert-manager.io/v1alpha1
        kind: Bundle
        metadata:
          name: linkerd-identity-trust-roots
        spec:
          sources:
            - secret:
                name: linkerd-trust-anchor
                key: tls.crt
          target:
            configMap:
              key: ca-bundle.crt
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
{{- end }}
