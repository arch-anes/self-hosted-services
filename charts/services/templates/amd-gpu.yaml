{{- if and .Values.primaryTenant (include "app.enabled" (list . "amd_gpu")) }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: amd-gpu
  namespace: kube-system
spec:
  chart: amd-gpu
  repo: https://rocm.github.io/k8s-device-plugin/
  version: 0.21.0
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true
  values:
    tolerations:
      - key: "dedicated"
        operator: Equal
        value: "ai"
        effect: "NoSchedule"
    node_selector_enabled: true
    dp:
      resources:
        requests:
          memory: {{ include "app.resources.memory" (list $ "64Mi") }}
          cpu: {{ include "app.resources.cpu" (list $ "250m") }}
        limits:
          memory: 128Mi
{{- end }}
