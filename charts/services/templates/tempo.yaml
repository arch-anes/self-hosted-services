{{- if and .Values.primaryTenant  (include "app.enabled" (list . "tempo")) }}
{{- include "app.require" (list . "Tempo" "prometheus" "Prometheus") -}}
{{- include "app.require" (list . "Tempo" "minio" "MinIO") -}}
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: tempo
#   namespace: kube-system
# type: Opaque
# stringData:
#   accessKey: "some_key"
#   secretKey: "some_key"

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: tempo
  namespace: kube-system
spec:
  repo: https://grafana.github.io/helm-charts
  chart: tempo
  version: 1.23.3
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true
  values:
    tempo:
      reportingEnabled: false
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo
              key: secretKey
      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo
            endpoint: minio.{{ .Values.applicationsNamespace }}.svc.cluster.local
            region: us-east-1
            insecure: true
            forcepathstyle: true
      retention: 8760h # 1 year
      resources:
        requests:
          cpu: {{ include "app.resources.cpu" (list $ "200m") }}
          memory: {{ include "app.resources.memory" (list $ "512Mi") }}
        limits:
          memory: 4Gi
      metricsGenerator:
        enabled: true
        remoteWriteUrl: "http://prometheus-kube-prometheus-prometheus:9090/api/v1/write"
      overrides:
        defaults:
          metrics_generator:
            processors:
              - span-metrics
              - service-graphs
              - local-blocks
    serviceMonitor:
      enabled: true
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: local-path-ephemeral
    nodeSelector:
      # Schedule onto amd64 to specifically avoid raspberry pi to not wear the SD card
      kubernetes.io/arch: amd64
{{- end }}
