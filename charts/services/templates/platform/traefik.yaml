#   credentials: "admin:$2y$12$8KtQ4SQb6QpebcgYvMPjwOv3Jz9ojkNq8FVWZmk5q1BW9BoEX2aAy" # admin:admin by default, bcrypted password: https://bcrypt-generator.com/

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: platform
spec:
  chart: traefik
  repo: https://traefik.github.io/charts
  version: 42.4.1
  targetNamespace: platform
  serverSide: "true"
  forceConflicts: true
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: cluster-admin-authentication
          namespace: platform
          labels:
            networking.arch-anes.io/public: "true"
        spec:
          basicAuth:
            secret: "cluster-admin-credentials"
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: traefik-websecure
          namespace: platform
          labels:
            networking.arch-anes.io/public: "true"
        spec:
          headers:
            browserXssFilter: true
            stsPreload: true
            stsIncludeSubdomains: true
            forceSTSHeader: true
            stsSeconds: 15552000
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: traefik-redirect-www
          namespace: platform
          labels:
            networking.arch-anes.io/public: "true"
        spec:
          redirectRegex:
            regex: ^https?://www\.(.*)
            replacement: https://$1
            permanent: true
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: intranet-allowlist
          namespace: platform
          labels:
            networking.arch-anes.io/public: "true"
        spec:
          ipAllowList:
            sourceRange:
              {{- include "ip.private_ranges" . | nindent 14 }}
      {{- if (include "app.enabled" (list . "crowdsec")) }}
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: crowdsec
          namespace: platform
          labels:
            networking.arch-anes.io/public: "true"
        spec:
          plugin:
            crowdsec-bouncer-traefik-plugin:
              enabled: true
              crowdsecAppsecFailureBlock: false
              crowdsecAppsecUnreachableBlock: false
              crowdsecMode: stream
              crowdsecLapiScheme: http
              crowdsecLapiHost: crowdsec-service:8080
              crowdsecLapiKeyFile: /etc/traefik/secrets/crowdsec/bouncer_key
              updateMaxFailure: 10
              redisCacheEnabled: false
              forwardedHeadersTrustedIPs:
                {{- concat (include "ip.public_proxy_ranges" . | fromYamlArray) (include "ip.private_proxy_ranges" . | fromYamlArray) | toYaml | nindent 16 }}
              clientTrustedIPs:
                {{- include "ip.private_ranges" . | nindent 16 }}
      {{- end }}
    experimental:
      plugins:
        crowdsec-bouncer-traefik-plugin:
          moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
          version: "v1.8.2"
    volumes:
      - name: crowdsec
        mountPath: /etc/traefik/secrets/crowdsec/
        type: secret
    deployment:
      initContainers:
        - name: wait-for-network
          image: busybox:1
          command: ['sh', '-c', 'until nslookup github.com; do echo waiting for network; sleep 2; done']
    global:
      checkNewVersion: false
    accessLog:
      enabled: true
      addInternals: true
      fields:
        headers:
          defaultMode: keep
    metrics:
      addInternals: {{ include "metrics.enabled" . | default false }}
      prometheus:
        service:
          enabled: {{ include "metrics.enabled" . | default false }}
        serviceMonitor:
          enabled: {{ include "metrics.enabled" . | default false }}
    {{- if (include "app.enabled" (list . "tempo")) }}
    tracing:
      capturedRequestHeaders:
        - "X-Real-Ip"
        - "X-Forwarded-For"
        - "True-Client-IP"
        - "CF-Connecting-IP"
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://tempo:4318/v1/traces
    {{- end }}
    nodeSelector:
      public: "true"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
                  app.kubernetes.io/instance: traefik-platform
    ingressRoute:
      healthcheck:
        enabled: true
        annotations:
          homer.item.excluded: "true"
      dashboard:
        enabled: true
        annotations:
          homer.service.name: Monitoring
          homer.service.icon: "fas fa-heartbeat"
          homer.service.rank: "6"
          homer.item.name: "Traefik Dashboard"
          homer.item.logo: "https://raw.githubusercontent.com/traefik/traefik/aa8eb1af6eb5457516169315676ec22f968e727d/webui/public/app-logo-128x128.png"
        matchRule: Host(`traefik.{{ .Values.fqdn }}`)
        middlewares:
          - name: platform-intranet-allowlist@kubernetescrd
          - name: platform-cluster-admin-authentication@kubernetescrd
        entryPoints:
          - web
          - websecure
        tls:
          secretName: "{{ .Values.fqdn }}-tls"
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        ingressClass: ""
        # This release also serves traefik-public Ingresses for LAN and
        # Tailscale clients. Leave status publication to the public release so
        # two controllers do not fight over the same Ingress status.
        publishedService:
          enabled: false
    service:
      spec:
        externalTrafficPolicy: {{ if .Values.behindTcpProxy }}Local{{ else }}Cluster{{ end }}
    ports:
      traefik:
        expose:
          default: true
        exposedPort: 9000
      web:
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        {{- if .Values.behindTcpProxy }}
        proxyProtocol:
          trustedIPs:
            {{- include "ip.private_proxy_ranges" . | nindent 12 }}
        forwardedHeaders:
          trustedIPs:
            {{- include "ip.private_proxy_ranges" . | nindent 12 }}
        {{- end }}
      websecure:
        exposedPort: 443
        {{- if .Values.behindTcpProxy }}
        proxyProtocol:
          trustedIPs:
            {{- include "ip.private_proxy_ranges" . | nindent 12 }}
        forwardedHeaders:
          trustedIPs:
            {{- include "ip.private_proxy_ranges" . | nindent 12 }}
        {{- end }}
        transport:
          respondingTimeouts:
            readTimeout: 0
        http:
          middlewares:
            - platform-traefik-redirect-www@kubernetescrd
            - platform-traefik-websecure@kubernetescrd
            {{- if (include "app.enabled" (list . "crowdsec")) }}
            - platform-crowdsec@kubernetescrd
            {{- end }}
          tls:
            enabled: true
        http3:
          enabled: true
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "512Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "1000m") }}
      limits:
        memory: 512Mi
    autoscaling:
      enabled: {{ include "ha.enabled" . | default false }}
      minReplicas: 3
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 60

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik-public
  namespace: platform
spec:
  chart: traefik
  repo: https://traefik.github.io/charts
  version: 42.4.1
  targetNamespace: platform
  serverSide: "true"
  forceConflicts: true
  values:
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-public
    serviceAccount:
      name: traefik-public
    # Public Traefik uses a dedicated, application-namespace-scoped Role
    # instead of the chart's cluster-wide RBAC. It does not watch the platform
    # namespace and therefore cannot read platform secrets.
    rbac:
      enabled: false
    experimental:
      plugins:
        crowdsec-bouncer-traefik-plugin:
          moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
          version: "v1.8.2"
    volumes:
      - name: crowdsec
        mountPath: /etc/traefik/secrets/crowdsec/
        type: secret
    deployment:
      initContainers:
        - name: wait-for-network
          image: busybox:1
          command: ['sh', '-c', 'until nslookup github.com; do echo waiting for network; sleep 2; done']
    global:
      checkNewVersion: false
    accessLog:
      enabled: true
      addInternals: true
      fields:
        headers:
          defaultMode: keep
    metrics:
      addInternals: {{ include "metrics.enabled" . | default false }}
      prometheus:
        service:
          enabled: {{ include "metrics.enabled" . | default false }}
        serviceMonitor:
          enabled: {{ include "metrics.enabled" . | default false }}
    {{- if (include "app.enabled" (list . "tempo")) }}
    tracing:
      capturedRequestHeaders:
        - "X-Real-Ip"
        - "X-Forwarded-For"
        - "True-Client-IP"
        - "CF-Connecting-IP"
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://tempo:4318/v1/traces
    {{- end }}
    nodeSelector:
      public: "true"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
                  app.kubernetes.io/instance: traefik-public-platform
    ingressRoute:
      healthcheck:
        enabled: true
        annotations:
          homer.item.excluded: "true"
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        namespaces:
          - "{{ .Values.applicationsNamespace }}"
        labelSelector: networking.arch-anes.io/public=true
      kubernetesIngress:
        ingressClass: traefik-public
        namespaces:
          - "{{ .Values.applicationsNamespace }}"
    service:
      spec:
        externalTrafficPolicy: {{ if .Values.behindTcpProxy }}Local{{ else }}Cluster{{ end }}
    ports:
      traefik:
        expose:
          default: true
        exposedPort: 9001
      web:
        exposedPort: 8080
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        {{- if .Values.behindTcpProxy }}
        proxyProtocol:
          trustedIPs:
            {{- include "ip.public_proxy_ranges" . | nindent 12 }}
        forwardedHeaders:
          trustedIPs:
            {{- include "ip.public_proxy_ranges" . | nindent 12 }}
        {{- end }}
      websecure:
        exposedPort: 8443
        {{- if .Values.behindTcpProxy }}
        proxyProtocol:
          trustedIPs:
            {{- include "ip.public_proxy_ranges" . | nindent 12 }}
        forwardedHeaders:
          trustedIPs:
            {{- include "ip.public_proxy_ranges" . | nindent 12 }}
        {{- end }}
        transport:
          respondingTimeouts:
            readTimeout: 0
        http:
          middlewares:
            - "{{ .Values.applicationsNamespace }}-traefik-redirect-www@kubernetescrd"
            - "{{ .Values.applicationsNamespace }}-traefik-websecure@kubernetescrd"
            {{- if (include "app.enabled" (list . "crowdsec")) }}
            - "{{ .Values.applicationsNamespace }}-crowdsec@kubernetescrd"
            {{- end }}
          tls:
            enabled: true
        http3:
          enabled: true
      {{- range $name, $port := dict "imap" 993 "smtp" 465 "mx" 2465 "mqtt" 1883 "mqtts" 8883 }}
      {{ $name }}:
        {{- if $.Values.behindTcpProxy }}
        proxyProtocol:
          trustedIPs:
            {{- include "ip.public_proxy_ranges" $ | nindent 12 }}
        {{- end }}
        port: {{ $port }}
        expose:
          default: true
        exposedPort: {{ $port }}
        protocol: TCP
        transport:
          respondingTimeouts:
            readTimeout: 0
            idleTimeout: 1h
      {{- end }}
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "512Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "1000m") }}
      limits:
        memory: 512Mi
    autoscaling:
      enabled: {{ include "ha.enabled" . | default false }}
      minReplicas: 3
      maxReplicas: 10
      metrics:
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 60

---
# The public Traefik only reads routing resources in the application namespace.
# It still watches Secrets because Traefik's Kubernetes providers require a
# secret informer even when no Ingress uses a TLS secret. Restricting the
# provider to the application namespace keeps platform secrets (cluster admin
# credentials, SMTP, Authentik, etc.) out of reach, but a future change should
# move public applications to their own namespace to isolate application
# secrets as well.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-public
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-public
subjects:
  - kind: ServiceAccount
    name: traefik-public
    namespace: platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-public
  namespace: "{{ .Values.applicationsNamespace }}"
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - pods
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - patch
      - update
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewaretcps
      - middlewares
      - serverstransporttcps
      - serverstransports
      - tlsoptions
      - tlsstores
      - traefikservices
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-public
  namespace: "{{ .Values.applicationsNamespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-public
subjects:
  - kind: ServiceAccount
    name: traefik-public
    namespace: platform
{{- end }}
