{{- if and .Values.primaryTenant (include "app.enabled" (list . "smartctl_exporter")) }}
{{- include "app.require" (list . "S.M.A.R.T. Exporter" "prometheus" "Prometheus") -}}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: smartctl-exporter
  namespace: platform
spec:
  chart: prometheus-smartctl-exporter
  repo: https://prometheus-community.github.io/helm-charts
  version: 0.19.2
  targetNamespace: platform
  serverSide: "true"
  forceConflicts: true
  values:
    image:
      # smartctl_exporter v0.15.0 omits several SCSI metric descriptors, so SAS
      # drives make /metrics return HTTP 500. v0.14.0 derives them at runtime.
      # https://github.com/prometheus-community/smartctl_exporter/issues/403
      #
      # v0.14.0 is amd64-only, hence the node selector. Remove the pin and the
      # selector once v0.16.0 ships the descriptor fix:
      # https://github.com/prometheus-community/smartctl_exporter/pull/409
      tag: v0.14.0
    nodeSelector:
      kubernetes.io/arch: amd64
    serviceMonitor:
      enabled: {{ include "metrics.enabled" . | default false }}
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
          action: replace
    prometheusRules:
      enabled: true
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: {{ include "app.resources.cpu" (list $ "10m") }}
        memory: {{ include "app.resources.memory" (list $ "32Mi") }}
{{- end }}
