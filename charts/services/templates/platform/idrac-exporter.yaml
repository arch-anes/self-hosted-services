---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: idrac-exporter
  namespace: platform
spec:
  chart: idrac-exporter
  repo: https://mrlhansen.github.io/idrac_exporter
  version: 3.0.0
  targetNamespace: platform
  serverSide: "true"
  forceConflicts: true
  values:
    existingSecret: idrac-exporter-config
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: {{ include "app.resources.cpu" (list $ "250m") }}
        memory: {{ include "app.resources.memory" (list $ "128Mi") }}
    prometheus:
      scrapeConfig:
        enabled: true
{{- end }}
