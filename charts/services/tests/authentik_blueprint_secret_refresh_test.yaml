suite: Authentik blueprint Secret refresh
templates:
  - gotify.yaml
set:
  enableAllApplicationsByDefault: false
  applications:
    authentik:
      enabled: true
    gotify:
      enabled: true
    postgresql:
      enabled: true
tests:
  - it: creates a Secret-mounted hash trigger for the Gotify blueprint
    documentIndex: 0
    asserts:
      - equal:
          path: spec.values.extraTpl[1].spec.target.template.engineVersion
          value: v2
      - equal:
          path: spec.values.extraTpl[1].spec.target.template.mergePolicy
          value: Merge
      - equal:
          path: spec.values.extraTpl[1].spec.target.template.data
          value:
            authentik-blueprint-refresh.yaml: |-
              version: 1
              metadata:
                name: Reapply Gotify OAuth2 Provider
                labels:
                  blueprints.goauthentik.io/secret-hash: '{{ . | toJson | sha256sum }}'
              entries:
                meta:
                  - model: authentik_blueprints.metaapplyblueprint
                    identifiers:
                      name: Gotify OAuth2 Provider
                    required: false
