# code: language=ansible
---

- name: Gather facts if not already collected
  ansible.builtin.setup:
  when: ansible_facts['kernel'] is not defined

- name: Detect machine type
  ansible.builtin.set_fact:
    prepare_detect_is_raspberry_pi: "{{ 'raspi' in ansible_facts['kernel'] }}"
    prepare_detect_is_openwrt: "{{ ansible_facts['distribution'] == 'OpenWrt' }}"

- name: Detect OpenWrt package manager
  when: prepare_detect_is_openwrt
  block:
    - name: Check for OpenWrt package manager binaries
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - { name: apk, path: /usr/bin/apk }
        - { name: opkg, path: /usr/bin/opkg }
      register: prepare_detect_package_manager_binaries

    - name: Set OpenWrt package manager
      ansible.builtin.set_fact:
        prepare_detect_package_manager: >-
          {{
            prepare_detect_package_manager_binaries.results
            | selectattr('stat.exists')
            | map(attribute='item.name')
            | first
            | default('')
          }}

    - name: Require a supported OpenWrt package manager
      ansible.builtin.assert:
        that:
          - prepare_detect_package_manager in ['apk', 'opkg']
        fail_msg: >-
          Neither apk nor opkg was found on {{ inventory_hostname }}.

- name: Detect router network facts
  when: prepare_detect_is_openwrt
  block:
    - name: Detect WAN Interface
      ansible.builtin.set_fact:
        prepare_detect_wan_interface: "{{ wan_interface | default(ansible_facts['default_ipv4']['interface']) }}"

    - name: Detect router LAN IP
      ansible.builtin.set_fact:
        prepare_detect_router_lan_ip: "{{ lan_ip | default(ansible_facts['br_lan']['ipv4']['address']) }}"

    - name: Deduce public HAProxy virtual IP
      ansible.builtin.set_fact:
        prepare_detect_haproxy_virtual_ip: "{{ haproxy.virtual_ip | default(prepare_detect_router_lan_ip | ansible.utils.ipmath(1)) }}"

    - name: Deduce private HAProxy virtual IP
      ansible.builtin.set_fact:
        prepare_detect_haproxy_private_ip: "{{ haproxy.private_virtual_ip | default(prepare_detect_haproxy_virtual_ip | ansible.utils.ipmath(1)) }}"

    - name: Require distinct HAProxy virtual IPs
      ansible.builtin.assert:
        that:
          - prepare_detect_haproxy_virtual_ip != prepare_detect_haproxy_private_ip
        fail_msg: >-
          The public and private HAProxy virtual IPs must be different
          ({{ prepare_detect_haproxy_virtual_ip }} and
          {{ prepare_detect_haproxy_private_ip }}).

- name: Determine CPU architecture
  ansible.builtin.set_fact:
    prepare_detect_cpu_arch: >-
      {{
        'amd64' if ansible_facts['architecture'] == 'x86_64' else
        'arm64' if ansible_facts['architecture'] == 'aarch64' else
        'armv7' if ansible_facts['machine'] == 'armv7l' else
        'unknown'
      }}
