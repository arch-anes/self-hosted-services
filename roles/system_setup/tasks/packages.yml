# code: language=ansible
---

- name: Install Ubuntu packages
  become: true
  when: ansible_facts['distribution'] == 'Ubuntu'
  block:
    - name: Install common packages
      ansible.builtin.apt:
        pkg:
          - curl
          - diffutils
          - etcd-client
          - ethtool
          - htop
          - kexec-tools
          - nnn
          - rasdaemon
          - rsync
          - sanoid
          - smartmontools
          - ufw
          - wakeonlan
          - zfsutils-linux
        update_cache: true

- name: Install OpenWrt packages
  become: true
  when: prepare_detect_is_openwrt
  vars:
    system_setup_openwrt_packages:
      - diffutils
      - ethtool
      - fish
      - haproxy
      - htop
      - ip6tables-nft
      - luci-app-sqm
      - nnn
      - procps-ng-pkill
      - tailscale
      - tmux
      - vim
  block:
    - name: Install common packages with apk
      community.general.apk:
        name: "{{ system_setup_openwrt_packages }}"
        state: present
        update_cache: true
      when: prepare_detect_package_manager == 'apk'

    - name: Install common packages with opkg
      community.general.opkg:
        name: "{{ system_setup_openwrt_packages }}"
        state: present
        update_cache: true
      when: prepare_detect_package_manager == 'opkg'
