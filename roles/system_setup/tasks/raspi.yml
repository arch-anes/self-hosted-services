# code: language=ansible

---
- name: Configure Raspberry Pi machine
  when: prepare_detect_is_raspberry_pi
  become: true
  block:
    - name: Find boot command line files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/current/cmdline.txt
        - /boot/firmware/new/cmdline.txt
      register: system_setup_raspi_cmdline_files

    # https://stackoverflow.com/a/61974725
    - name: Enable cgroups
      ansible.builtin.replace:
        path: "{{ item.0 }}"
        regexp: '^([\w](?!.*\b{{ item.1 }}\b).*)$'
        replace: '\1 {{ item.1 }}'
      loop: >-
        {{
          system_setup_raspi_cmdline_files.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | product([
              'cgroup_enable=cpuset',
              'cgroup_enable=memory',
              'cgroup_memory=1',
            ])
          | list
        }}

    - name: Enable watchdog
      ansible.builtin.lineinfile:
        path: /etc/systemd/system.conf
        line: RuntimeWatchdogSec=15

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
