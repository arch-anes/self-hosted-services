# code: language=ansible

---
- name: Setup router
  any_errors_fatal: true
  hosts: routers
  gather_facts: false
  pre_tasks:
    - name: Install Python on OpenWrt
      ansible.builtin.raw: |
        if command -v apk >/dev/null 2>&1; then
          apk update
          apk add python3
        elif command -v opkg >/dev/null 2>&1; then
          opkg update
          opkg install python3
        else
          echo "Neither apk nor opkg is available on this host" >&2
          exit 1
        fi
      register: install_python
      changed_when: "'Installing' in install_python.stdout or 'Upgrading' in install_python.stdout"
  roles:
    - name: Global handlers
      role: common

    - name: Prepare hosts and controller state
      role: prepare

    - name: Setup system
      role: system_setup
      when:
        - not skip_system_setup

    - name: Create a VPN mesh network
      role: vpn
      when:
        - not skip_vpn_setup

    - name: Setup haproxy
      role: haproxy

    - name: Setup QoS
      role: qos
